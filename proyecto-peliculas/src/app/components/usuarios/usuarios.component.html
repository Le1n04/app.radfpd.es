<div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
  
      <!-- ID Usuario -->
      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef>
          <div class="fake-input">{{ idFilter.value || 'Id' }}</div>
          <span mat-sort-header="id_usuario"></span>
        </th>
        <td mat-cell *matCellDef="let usuario"> {{ usuario.id_usuario }} </td>
      </ng-container>
  
      <!-- Usuario -->
      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef>
          <div class="fake-input">{{ usuarioFilter.value || 'Usuario' }}</div>
          <span mat-sort-header="usuario"></span>
        </th>
        <td mat-cell *matCellDef="let usuario"> {{ usuario.usuario }} </td>
      </ng-container>
  
      <!-- Nombre Público -->
      <ng-container matColumnDef="nombre_publico">
        <th mat-header-cell *matHeaderCellDef>
          <div class="fake-input">{{ nombreFilter.value || 'Nombre' }}</div>
          <span mat-sort-header="nombre_publico"></span>
        </th>
        <td mat-cell *matCellDef="let usuario"> {{ usuario.nombre_publico }} </td>
      </ng-container>
  
      <!-- Rol -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>
          <div class="fake-input">{{ rolFilter.value || 'Rol' }}</div>
          <span mat-sort-header="rol"></span>
        </th>
        <td mat-cell *matCellDef="let usuario"> {{ usuario.rol }} </td>
      </ng-container>
  
      <!-- Habilitado -->
      <ng-container matColumnDef="habilitado">
        <th mat-header-cell *matHeaderCellDef>
          <mat-form-field appearance="outline">
            <mat-select placeholder="Habilitado" (selectionChange)="buscarHabilitados($event)">
              <mat-option [value]="1">Sí</mat-option>
              <mat-option [value]="0">No</mat-option>
            </mat-select>
          </mat-form-field>
        </th>
        <td mat-cell *matCellDef="let usuario">
          {{ usuario.habilitado === 1 ? 'Sí' : 'No' }}
        </td>
      </ng-container>
  
      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button id="addUsuario" mat-icon-button *ngIf="permises?.add" 
            (click)="addUsuario()" aria-label="Añadir usuario">
            <mat-icon>add_circle</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let usuario">
          <button id="editUsuario" mat-icon-button *ngIf="permises?.edit" 
            (click)="editUsuario(usuario)" aria-label="Editar usuario">
            <mat-icon>edit</mat-icon>
          </button>
          <button id="deleteUsuario" mat-icon-button *ngIf="permises?.delete" 
            (click)="deleteUsuario(usuario)" aria-label="Eliminar usuario">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <!-- Paginador -->
    <mat-paginator 
      #paginator 
      [pageSize]="10" 
      [pageSizeOptions]="[5, 10, 25]" 
      aria-label="Selector de página">
    </mat-paginator>
  </div>
